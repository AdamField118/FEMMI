[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "femmi"
version = "0.1.0"
description = "FEM-based mass inversion for weak gravitational lensing"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Adam Field", email = "adfield@wpi.edu" },
]
license = { text = "MIT" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "jax>=0.4.20",
  "jaxlib>=0.4.20",
  "numpy>=1.24.0",
  "matplotlib>=3.7.0",
  "scipy>=1.10.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "jupyter>=1.0.0"]
mesh = ["triangle>=20200424"]
io = ["astropy>=5.0"]        # FITS shear catalogs and Frontier Fields model maps
neural = ["flax>=0.8", "optax>=0.2"]   # learned score prior (prior='neural')
galsim = ["galsim>=2.5"]     # independent-truth NFW benchmark (examples/diagnostics/galsim_nfw_benchmark.py)
docs = ["mkdocs-material>=9.5"]        # documentation site (mkdocs serve / build)
# Exact Remy et al. 2020 reproduction: GalSim (independent-truth benchmark) and
# astropy (read MassiveNuS convergence maps for prior.neural.train_data=massivenus).
paper = ["galsim>=2.5", "astropy>=5.0"]

[project.scripts]
femmi = "femmi.cli:main"

[project.urls]
Repository = "https://github.com/AdamField118/FEMMI"

[tool.setuptools.packages.find]
where = ["."]
include = ["femmi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "slow: heavy tests (neural DSM training, large sampling runs). Deselect with -m 'not slow'.",
]