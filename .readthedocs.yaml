# Read the Docs build configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Build the MkDocs site defined in mkdocs.yml.
mkdocs:
  configuration: mkdocs.yml

# The docs are static Markdown, so we only need the docs toolchain -- not the
# full femmi/JAX stack. Keeps RTD builds fast.
python:
  install:
    - requirements: docs/requirements.txt
