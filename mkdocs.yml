site_name: FEMMI
site_description: Finite Element Mass Map Inversion for weak gravitational lensing
repo_url: https://github.com/AdamField118/FEMMI
repo_name: AdamField118/FEMMI
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Catalogue mapper: mapper.md
  - API reference: api.md
  - Survey FITS workflow: survey-io.md
  - SMPy benchmarks: smpy-benchmarks.md
  - Production performance: production-performance.md
  - Configuration & CLI: configuration.md
  - Observation model: observation-model.md
  - Calibrated comparisons: calibration.md
  - Priors & sampling: priors-and-sampling.md
  - Neural prior: neural-prior.md
  - Development: development.md
