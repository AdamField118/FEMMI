name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast signal on every supported Python: everything except the heavy
  # (neural DSM training / large sampling) tests, which are marked `slow`.
  test:
    name: fast tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Critical-error lint (no style gate)
        run: |
          pip install ruff
          # Only syntax errors and undefined names -- real bugs, not formatting.
          ruff check --select E9,F63,F7,F82 femmi tests examples

      - name: Run fast test suite
        env:
          JAX_ENABLE_X64: "1"
        run: pytest -q -m "not slow"

  # Full coverage including the slow tests, once (Python 3.11 only) so the
  # neural-prior and large-sampling paths are still exercised on every push
  # without slowing the per-version signal above.
  #
  # Require optional scientific dependencies so their tests cannot skip silently.
  test-full:
    name: full tests incl. slow + optional extras (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install GalSim build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev libeigen3-dev

      - name: Install package (with dev + all optional extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,neural,galsim,io,speed]"
          pip install "SMPy @ git+https://github.com/GeorgeVassilakis/SMPy.git@26d231f5b4b22b41e76cb3bd3143d799c2e7ebfe"

      - name: Run full test suite (optional extras required, not skippable)
        env:
          JAX_ENABLE_X64: "1"
          FEMMI_REQUIRE_OPTIONAL: "1"
        run: |
          python -c "import smpy"
          pytest -q

  docs:
    name: documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r docs/requirements.txt
      - run: mkdocs build --strict
