name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast signal on every supported Python: everything except the heavy
  # (neural DSM training / large sampling) tests, which are marked `slow`.
  test:
    name: fast tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Critical-error lint (no style gate)
        run: |
          pip install ruff
          # Only syntax errors and undefined names -- real bugs, not formatting.
          ruff check --select E9,F63,F7,F82 femmi tests examples

      - name: Run fast test suite
        env:
          JAX_ENABLE_X64: "1"
        run: pytest -q -m "not slow"

  # Full coverage including the slow tests, once (Python 3.11 only) so the
  # neural-prior and large-sampling paths are still exercised on every push
  # without slowing the per-version signal above.
  test-full:
    name: full tests incl. slow (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package (with dev + neural extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,neural]"

      - name: Run full test suite
        env:
          JAX_ENABLE_X64: "1"
        run: pytest -q
