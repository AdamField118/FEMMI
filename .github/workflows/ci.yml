name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast signal on every supported Python: everything except the heavy
  # (neural DSM training / large sampling) tests, which are marked `slow`.
  test:
    name: fast tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Critical-error lint (no style gate)
        run: |
          pip install ruff
          # Only syntax errors and undefined names -- real bugs, not formatting.
          ruff check --select E9,F63,F7,F82 femmi tests examples

      - name: Run fast test suite
        env:
          JAX_ENABLE_X64: "1"
        run: pytest -q -m "not slow"

  # Full coverage including the slow tests, once (Python 3.11 only) so the
  # neural-prior and large-sampling paths are still exercised on every push
  # without slowing the per-version signal above.
  #
  # This job also installs the OPTIONAL extras and sets FEMMI_REQUIRE_OPTIONAL,
  # which turns a missing extra into a hard failure instead of a silent skip.
  # Without that, five GalSim-gated modules -- including test_truth and
  # test_density, which guard the results in MATH.md 18.3.10 -- skipped on every
  # push and the suite still reported green. See tests/conftest.py.
  test-full:
    name: full tests incl. slow + optional extras (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install GalSim build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev libeigen3-dev

      - name: Install package (with dev + all optional extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,neural,galsim,io]"

      - name: Run full test suite (optional extras required, not skippable)
        env:
          JAX_ENABLE_X64: "1"
          FEMMI_REQUIRE_OPTIONAL: "1"
        run: pytest -q
