# Config for examples/paper_artifacts.py (Remy et al. 2020 figure recreation).
#   python examples/paper_artifacts.py --config configs/paper_artifacts.yaml
# Uses the same schema as configs/default.yaml; this run is a structured-grid
# posterior-sampling job with a survey mask. Switch prior.kind to 'neural' for
# the annealed-HMC version.

forward:
  geometry: square         # structured grid (forced by the script anyway)
  nx: 18
  half_width: 2.5
  coupling: steinbach

data:
  source: synthetic
  kappa_sigma: 0.5
  shape_noise: 0.06
  seed: 0
  mask_radius: 0.6         # circular missing-data hole
  mask_center: [0.3, -0.4]

inverse:
  method: sample           # posterior UQ (forced by the script)
  lam: null                # null -> auto-calibrated (Morozov for Wiener/RTO,
                           # 1.0 for the neural score prior). Set a number to override.
  wiener_length: 0.5

prior:
  kind: neural             # wiener -> exact RTO; neural -> annealed HMC
  neural: {n_pix: 64, base: 32, ckpt: null, hybrid: true, train_data: massivenus, data_dir: /home/adfield/FEMMI/data/massivenus/convergence_maps/Maps10/}   # hybrid: true -> 1-to-1 with
  #        Remy 2020 (net learns only the non-Gaussian residual on an analytic Gaussian prior)

sampler:
  method: auto
  n_samples: 300           # rto draws
  # annealed HMC (used when prior.kind is non-Gaussian):
  n_levels: 10
  steps_per_level: 12
  n_chains: 40
  n_leapfrog: 5
  keep_final: 4

output:
  dir: runs
  name: paper
